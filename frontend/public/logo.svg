<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Blue rounded background -->
  <rect width="40" height="40" rx="9" fill="#1d4ed8"/>
  <!-- "LS" monogram - clean geometric lettermark -->
  <!-- Letter L: vertical stroke -->
  <rect x="10" y="11" width="4.5" height="18" rx="1.5" fill="white"/>
  <!-- Letter L: horizontal stroke -->
  <rect x="10" y="24.5" width="12" height="4.5" rx="1.5" fill="white"/>
  <!-- Letter S: three horizontal bars stacked -->
  <rect x="24" y="11" width="6" height="3.5" rx="1.5" fill="white"/>
  <rect x="24" y="18.25" width="6" height="3.5" rx="1.5" fill="white"/>
  <rect x="24" y="25.5" width="6" height="3.5" rx="1.5" fill="white"/>
  <!-- S left connectors -->
  <rect x="24" y="11" width="3" height="10.75" rx="1.5" fill="white"/>
  <rect x="27" y="18.25" width="3" height="10.75" rx="1.5" fill="white"/>
</svg>
